<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- iOS & Mobile Viewport Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Task Tracker">
  <meta name="theme-color" content="#090b10">
  <meta name="format-detection" content="telephone=no">

  <title>Task Tracker</title>
  <meta name="description" content="Премиальный автономный трекер задач с планированием на Неделю и Месяц в стиле Dark Glassmorphism">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Lightweight Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Ambient Glass Background Lights (Mesh Glows) -->
  <div class="ambient-glow ambient-glow-top" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-middle" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-bottom" aria-hidden="true"></div>

  <div class="app-container" id="app">
    <!-- Header Section -->
    <header class="app-header">
      <!-- Top Title & App Badge -->
      <div class="header-top">
        <div class="date-container">
          <span class="date-day-label" id="current-day-label">Сегодня</span>
          <h1 class="date-title" id="current-date-title">Понедельник, 17 августа</h1>
        </div>
        <div class="app-logo-badge" title="Task Tracker PWA">
          <div class="status-indicator-dot"></div>
          <span>PWA</span>
        </div>
      </div>

      <!-- iOS Segmented Control: Неделя | Месяц (2 Вкладки) -->
      <div class="segmented-control" role="tablist" aria-label="Горизонт планирования">
        <button class="segment-btn active" role="tab" aria-selected="true" data-horizon="week" id="tab-week">
          <span>Неделя</span>
        </button>
        <button class="segment-btn" role="tab" aria-selected="false" data-horizon="month" id="tab-month">
          <span>Месяц</span>
        </button>
      </div>

      <!-- Horizon Date Navigation Bar -->
      <div class="horizon-nav-bar" id="horizon-nav-bar">
        <button class="nav-arrow-btn" id="nav-prev-btn" aria-label="Предыдущий период" title="Предыдущий">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="nav-current-label" id="nav-current-label">
          <span class="nav-label-text" id="nav-period-text">17 – 23 августа 2026</span>
          <button class="nav-today-badge" id="nav-today-btn" title="Вернуться к текущему периоду">Тек. неделя</button>
        </div>

        <button class="nav-arrow-btn" id="nav-next-btn" aria-label="Следующий период" title="Следующий">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- 7-Day Interactive Week Strip (Visible on Week mode) -->
      <div class="week-strip-wrapper" id="week-strip-wrapper">
        <div class="week-strip" id="week-strip" role="tablist" aria-label="Дни недели">
          <!-- 7 day cards dynamically rendered here -->
        </div>
      </div>

      <!-- Month Analytics Dashboard Cards (Visible on Month mode) -->
      <div class="month-stats-grid hidden" id="month-stats-grid">
        <div class="month-stat-card">
          <span class="month-stat-value" id="stat-total-count">0</span>
          <span class="month-stat-label">Всего</span>
        </div>
        <div class="month-stat-card">
          <span class="month-stat-value text-amber" id="stat-progress-count">0</span>
          <span class="month-stat-label">В работе</span>
        </div>
        <div class="month-stat-card">
          <span class="month-stat-value text-emerald" id="stat-done-count">0</span>
          <span class="month-stat-label">Выполнено</span>
        </div>
        <div class="month-stat-card">
          <span class="month-stat-value text-cyan" id="stat-rate-percent">0%</span>
          <span class="month-stat-label">Успешность</span>
        </div>
      </div>

      <!-- Interactive Progress Overview -->
      <div class="progress-card">
        <div class="progress-header">
          <div class="progress-info">
            <span class="progress-title" id="progress-title-label">Прогресс недели</span>
            <span class="progress-stats" id="progress-stats-text">0 из 0 сделано • 0%</span>
          </div>
          <span class="progress-badge" id="progress-badge-status">В фокусе</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar-track">
          <div class="progress-fill" id="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Quick Filter Pills -->
      <nav class="filter-nav" aria-label="Фильтры задач">
        <button class="filter-pill active" data-filter="all" id="filter-all">
          <span>Все</span>
          <span class="filter-count" id="count-all">0</span>
        </button>
        <button class="filter-pill" data-filter="in_progress" id="filter-in-progress">
          <span class="filter-dot amber"></span>
          <span>В работе</span>
          <span class="filter-count" id="count-in-progress">0</span>
        </button>
        <button class="filter-pill" data-filter="todo" id="filter-todo">
          <span class="filter-dot slate"></span>
          <span>План</span>
          <span class="filter-count" id="count-todo">0</span>
        </button>
      </nav>
    </header>

    <!-- Main Content Area: Scrollable Task Feed -->
    <main class="tasks-scroll-container">
      <!-- Active Tasks Section -->
      <section class="tasks-section" aria-labelledby="active-section-title">
        <div class="section-header">
          <h2 class="section-title" id="active-section-title">Активные задачи</h2>
          <span class="section-badge" id="active-tasks-count">0</span>
        </div>

        <ul class="task-list" id="active-tasks-list" role="list">
          <!-- Active tasks dynamically rendered here -->
        </ul>

        <!-- Empty State View -->
        <div class="empty-state hidden" id="empty-state-view">
          <div class="empty-icon-wrap">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <h3 class="empty-title" id="empty-state-title">Все задачи завершены!</h3>
          <p class="empty-subtitle" id="empty-state-subtitle">Добавьте новую задачу ниже или наслаждайтесь отдыхом</p>
        </div>
      </section>

      <!-- Completed Tasks Accordion -->
      <section class="completed-section" id="completed-section-container">
        <div class="accordion-header" id="completed-accordion-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="completed-tasks-wrapper">
          <div class="accordion-title-group">
            <svg class="accordion-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span class="accordion-title" id="completed-accordion-title">Сделано за неделю</span>
            <span class="completed-pill-count" id="completed-count-badge">0</span>
          </div>
          <button class="clear-completed-btn hidden" id="clear-completed-btn" title="Очистить завершенные задачи" aria-label="Очистить завершенные задачи">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
            Очистить
          </button>
        </div>

        <div class="accordion-content" id="completed-tasks-wrapper">
          <ul class="task-list completed-list" id="completed-tasks-list" role="list">
            <!-- Completed tasks dynamically rendered here -->
          </ul>
        </div>
      </section>
    </main>

    <!-- Floating Dynamic Island Input Bar -->
    <div class="floating-island-wrapper">
      <form class="dynamic-island-bar" id="add-task-form" autocomplete="off" onsubmit="return false;">
        <div class="island-input-group">
          <label for="task-input" class="sr-only">Текст новой задачи</label>
          <input 
            type="text" 
            id="task-input" 
            class="island-input" 
            placeholder="Что нужно сделать на этой неделе?" 
            maxlength="200"
            autocomplete="off" 
            autocorrect="on"
            autocapitalize="sentences"
            spellcheck="true"
          />
        </div>
        <button type="submit" class="island-submit-btn" id="add-task-btn" aria-label="Добавить задачу">
          <svg class="plus-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </form>
    </div>

    <!-- Toast Feedback Notification -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
  </div>

  <!-- Main JavaScript App -->
  <script src="app.js"></script>
</body>
</html>
