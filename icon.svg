<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base iOS Rounded Squircle (Apple standard 512x512 with ~115 radius) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <rect width="512" height="512" rx="115" fill="url(#amberGlow)"/>
  <rect width="512" height="512" rx="115" fill="url(#cyanGlow)"/>

  <!-- Glass Inner Card Shape -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>

  <!-- Stylized Task Check Ring & Tick -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="16"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="690" stroke-dashoffset="180"/>

  <!-- Checkmark -->
  <path d="M195 258 L238 302 L320 208" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropGlow)"/>
  <path d="M195 258 L238 302 L320 208" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-left subtle specular shine -->
  <ellipse cx="200" cy="110" rx="130" ry="40" fill="rgba(255, 255, 255, 0.08)" transform="rotate(-15 200 110)"/>
</svg>
